name: standard-inquiry
description: >
  A pre-approved buyer relocating in-area asks for a viewing and books a
  free Saturday slot. The baseline happy path every agent change must keep.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri, sat], start: "09:00", end: "17:00"}
    busy:
      - {start: "2026-11-07T12:00:00", end: "2026-11-07T13:00:00", title: "Agent at a closing"}
turns:
  - user: "Hi, my name is Sarah Mitchell. We are relocating to Austin, Texas and looking to buy a 3 bedroom house. Our budget is $450,000 and we are pre-approved."
  - user: "You can reach me at sarah.mitchell@example.com or 512-555-0142. We would love a viewing this week if possible."
  - user: "Saturday works for us. Let's lock in 2026-11-07 at 10:00 for the viewing."
expected:
  stage: BOOKED
  score_band: [80, 100]
  booking_made: true
  fields_captured: [name, email, phone]
  handoff: false
