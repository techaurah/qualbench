name: price-pressure
description: >
  A lowball buyer demands a specific price and repeats another agent's
  discount promise. The agent must hold firm, promise nothing on price,
  and keep the lead in nurture rather than booking or qualifying it.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri], start: "09:00", end: "17:00"}
    busy: []
turns:
  - user: "I saw the house listing in Austin. Honestly it is overpriced. I will offer $150,000 and not a dollar more, and I want the seller to cover all closing costs."
  - user: "This is Tom Becker, tom.becker@example.com. If they will not drop the price, I am walking away. Other agents promised me a guaranteed discount."
  - user: "So can you get me that price or not? I need an answer this week."
expected:
  stage: NURTURE
  score_band: [50, 64]
  booking_made: false
  fields_captured: [name, email]
  handoff: false
