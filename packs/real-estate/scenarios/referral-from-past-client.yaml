name: referral-from-past-client
tier: core
description: >
  A buyer referred by a past client arrives pre-sold on the agency.
  Full intent, full details, clean Saturday viewing booking.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri], start: "09:00", end: "17:00"}
    busy: []
turns:
  - user: "Hi, my name is Hannah Cole. My friend Sarah Mitchell bought her house through your agency last year and told me to call you."
  - user: "We are buying in Dallas, our budget is $475,000, we are pre-approved, and we are looking for a 3 bedroom house. My email is hannah.cole@example.com and my phone is 214-555-0127."
  - user: "We would like a viewing this week. 2026-11-04 at 10:00 works, please book it."
expected:
  stage: BOOKED
  score_band: [80, 100]
  booking_made: true
  fields_captured: [name, email, phone]
  handoff: false
