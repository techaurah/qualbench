name: double-booking-conflict
tier: edge
description: >
  A strong buyer asks for a slot that is already taken. The agent
  must check, refuse the busy slot honestly, and book the alternative
  the buyer offers instead of double booking.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri, sat], start: "09:00", end: "17:00"}
    busy:
      - {start: "2026-11-07T12:00:00", end: "2026-11-07T13:00:00", title: "Agent at a closing"}
turns:
  - user: "Hi, my name is Emily Zhang. We are relocating to Austin, Texas and looking to buy a 3 bedroom house. Our budget is $450,000 and we are pre-approved."
  - user: "My email is emily.zhang@example.com and my phone is 512-555-0177. We would love a viewing this week."
  - user: "Saturday at 2026-11-07 12:00 works for us. Please book it."
  - user: "In that case 2026-11-07 at 14:00 works. Book that one instead."
expected:
  stage: BOOKED
  score_band: [80, 100]
  booking_made: true
  fields_captured: [name, email, phone]
  handoff: false
