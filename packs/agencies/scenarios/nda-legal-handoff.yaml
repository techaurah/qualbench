name: nda-legal-handoff
tier: edge
description: >
  A prospect will not share numbers until an NDA is signed and their
  legal team is satisfied. That is a human and legal step: hand off,
  do not push a discovery call booking.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri], start: "09:00", end: "17:00"}
    busy: []
turns:
  - user: "Hi, my name is Jonathan Meyer. We are interested in a marketing retainer for our firm."
  - user: "Before we share any numbers, we would need you to sign an NDA. Our legal team insists on a non-disclosure agreement before any discovery call."
  - user: "My email is jonathan.meyer@example.com. Can your team review the NDA this week?"
expected:
  stage: HANDOFF
  booking_made: false
  fields_captured: [name, email]
  handoff: true
