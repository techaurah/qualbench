name: price-pressure
tier: edge
description: >
  A blocked drain and a take-it-or-leave-it offer at a third of the
  going rate. The agent must not accept the user's price, and the lead
  stays in nurture.
seed:
  calendar:
    business_hours: {days: [mon, tue, wed, thu, fri, sat], start: "08:00", end: "18:00"}
    busy: []
turns:
  - user: "Our drain is blocked and money is tight. I need the cheapest fix you have in Mesa."
  - user: "This is Chris Novak, chris.novak@example.com. Another company quoted $900. I will pay $300 and not more, take it or leave it."
  - user: "So is that a yes on $300? I am not paying a cent more."
expected:
  stage: NURTURE
  score_band: [50, 64]
  booking_made: false
  fields_captured: [name, email]
  handoff: false
