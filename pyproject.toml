[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualbench"
version = "0.1.0"
description = "Outcome regression testing for qualification and booking agents: deterministic assertions, mock calendar and CRM, vertical scenario packs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TechAurah" }]
keywords = [
  "ai-agents",
  "evaluation",
  "regression-testing",
  "llm",
  "booking",
  "qualification",
  "testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
qualbench = "qualbench.cli:main"

[project.urls]
Homepage = "https://github.com/techaurah/qualbench"
Repository = "https://github.com/techaurah/qualbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
